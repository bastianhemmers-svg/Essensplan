<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Essensplan</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:#f4f7fb;
  color:#203040;
}
.wrap{max-width:900px;margin:0 auto;padding:18px}
.card{
  background:#fff;
  border-radius:22px;
  padding:18px;
  box-shadow:0 8px 30px #00000012;
}
h1{margin:0 0 4px;font-size:29px}
.sub{margin:0 0 20px;color:#667085}
.day{
  border:1px solid #e1e7ef;
  border-radius:18px;
  margin:12px 0;
  padding:15px;
}
.dayhead{margin-bottom:12px}
.dayname{font-size:19px;font-weight:750}
.people{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
}
.person{
  border:0;
  border-radius:14px;
  padding:12px;
  background:#edf1f6;
}
.person.on{
  background:#dceaff;
  outline:2px solid #2f6fed;
  color:#1451b4;
}
.person-name{font-weight:750;font-size:15px;margin-bottom:9px}
.status-btn{
  width:100%;
  border:0;
  border-radius:10px;
  padding:9px;
  background:#fff;
  font-size:14px;
  font-weight:650;
  cursor:pointer;
}
.person.on .status-btn{
  background:#2f6fed;
  color:#fff;
}
.location-title{
  font-size:12px;
  color:#667085;
  font-weight:650;
  margin:10px 0 5px;
}
.locations{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:5px;
}
.location-btn{
  border:1px solid #d5dce6;
  background:#fff;
  border-radius:9px;
  padding:8px 4px;
  font-size:12px;
  cursor:pointer;
}
.location-btn.selected{
  background:#dceaff;
  border-color:#2f6fed;
  color:#1451b4;
  font-weight:700;
}
.cook{
  margin-top:12px;
  padding-top:12px;
  border-top:1px solid #edf0f4;
}
.cook label{
  font-size:14px;
  color:#667085;
  font-weight:650;
  display:block;
  margin-bottom:7px;
}
select{
  width:100%;
  padding:11px;
  border-radius:10px;
  border:1px solid #d5dce6;
  background:#fff;
  font-size:15px;
}
.status{
  font-size:13px;
  color:#667085;
  margin-top:15px;
  text-align:center;
}
.error{color:#b42318;font-weight:600;text-align:center}
.legend{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-bottom:15px;
  color:#667085;
  font-size:12px;
}
.legend span{
  background:#f1f4f8;
  padding:6px 9px;
  border-radius:999px;
}
@media(max-width:620px){
  .wrap{padding:10px}
  .card{padding:13px;border-radius:18px}
  .people{grid-template-columns:1fr}
  h1{font-size:25px}
}
</style>
</head>

<body>
<div class="wrap">
  <div class="card">
    <h1>🍽️ Essensplan</h1>
    <p class="sub">Wer ist heute zum Essen da?</p>

    <div class="legend">
      <span>✓ = zum Essen da</span>
      <span>Ort = aktueller Aufenthaltsort</span>
    </div>

    <div id="app">Essensplan wird geladen …</div>
    <div id="status" class="status"></div>
  </div>
</div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";
import {getAuth,signInAnonymously} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";
import {getDatabase,ref,onValue,set} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-database.js";

const firebaseConfig={
  apiKey:"AIzaSyDij8UfOCWqqhHxjMMGRrYWhEW6TwB3qI",
  authDomain:"essensplan-hanna-bastian.firebaseapp.com",
  databaseURL:"https://essensplan-hanna-bastian-default-rtdb.europe-west1.firebasedatabase.app",
  projectId:"essensplan-hanna-bastian",
  storageBucket:"essensplan-hanna-bastian.firebasestorage.app",
  messagingSenderId:"376800776043",
  appId:"1:376800776043:web:af669a07b5aac8d2b6462e"
};

const people=["Tanja","Bastian","Hanna","Matthias","Delia"];
const days=["Montag","Dienstag","Mittwoch","Donnerstag","Freitag","Samstag","Sonntag"];

/*
  Standard-Orte:
  Tanja, Bastian, Hanna -> Augsburg
  Matthias, Delia -> Eichstätt
  Samstag/Sonntag -> offen
*/
const defaultLocations={
  Tanja:"Augsburg",
  Bastian:"Augsburg",
  Hanna:"Augsburg",
  Matthias:"Eichstätt",
  Delia:"Eichstätt"
};

function weekKey(){
  const now=new Date();
  const d=new Date(now);
  const day=now.getDay(); // Sonntag = 0
  d.setDate(d.getDate()+(day===0?-6:1-day)); // Montag der aktuellen Woche

  // Die neue Woche beginnt sonntags um 18:00 Uhr.
  if(day===0 && now.getHours()>=18){
    d.setDate(d.getDate()+7);
  }
  return d.toISOString().slice(0,10);
}

let key=weekKey();
let data={};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getDatabase(app);

function defaultLocation(person,dayIndex){
  // Wochenende: keine Vorauswahl
  if(dayIndex>=5) return "";
  return defaultLocations[person] || "";
}

function normalizeDay(dayData,dayIndex){
  const raw=dayData || {};
  const result={};

  for(const person of people){
    // Alte "Mama"-Daten werden automatisch als "Tanja" übernommen,
    // solange Tanja für diesen Tag noch keinen eigenen Eintrag hat.
    let value=raw[person];

    if(person==="Tanja" && value===undefined && raw.Mama!==undefined){
      value=raw.Mama;
    }

    if(typeof value==="object" && value!==null){
      result[person]={
        home:!!value.home,
        location:value.location ?? defaultLocation(person,dayIndex)
      };
    }else{
      // Alte Version: Person war direkt true/false
      result[person]={
        home:!!value,
        location:defaultLocation(person,dayIndex)
      };
    }
  }

  let cook=raw.cook || "";
  if(cook==="Mama") cook="Tanja";

  result.cook=cook;
  return result;
}

function render(){
  let out="";

  for(let dayIndex=0;dayIndex<days.length;dayIndex++){
    const day=days[dayIndex];
    const e=normalizeDay(data[day],dayIndex);

    out+=`
      <section class="day">
        <div class="dayhead">
          <div class="dayname">${day}</div>
        </div>

        <div class="people">
    `;

    for(const person of people){
      const p=e[person];
      out+=`
        <div class="person ${p.home?"on":""}">
          <div class="person-name">${person}</div>

          <button class="status-btn"
            data-action="home"
            data-day="${day}"
            data-person="${person}">
            ${p.home?"✓ Zum Essen da":"Nicht zum Essen da"}
          </button>

          <div class="location-title">Aufenthaltsort</div>

          <div class="locations">
            <button class="location-btn ${p.location==="Augsburg"?"selected":""}"
              data-action="location"
              data-location="Augsburg"
              data-day="${day}"
              data-person="${person}">
              Augsburg
            </button>

            <button class="location-btn ${p.location==="Eichstätt"?"selected":""}"
              data-action="location"
              data-location="Eichstätt"
              data-day="${day}"
              data-person="${person}">
              Eichstätt
            </button>

            <button class="location-btn ${p.location===""?"selected":""}"
              data-action="location"
              data-location=""
              data-day="${day}"
              data-person="${person}">
              offen
            </button>
          </div>
        </div>
      `;
    }

    out+=`
        </div>

        <div class="cook">
          <label for="cook-${dayIndex}">Wer kocht?</label>
          <select id="cook-${dayIndex}"
            data-action="cook"
            data-day="${day}">
            <option value="">Noch offen</option>
            <option value="Niemand" ${e.cook==="Niemand"?"selected":""}>Niemand</option>
            ${people.map(p=>`
              <option value="${p}" ${e.cook===p?"selected":""}>${p}</option>
            `).join("")}
          </select>
        </div>
      </section>
    `;
  }

  document.getElementById("app").innerHTML=out;
}

async function saveDay(day,changes){
  const current=normalizeDay(data[day],days.indexOf(day));
  const updated={
    ...current,
    ...changes
  };

  await set(ref(db,`weeks/${key}/${day}`),updated);
}

document.addEventListener("click",async event=>{
  const el=event.target.closest("[data-action]");
  if(!el) return;

  const action=el.dataset.action;
  const day=el.dataset.day;
  const person=el.dataset.person;

  try{
    if(action==="home"){
      const current=normalizeDay(data[day],days.indexOf(day));
      current[person].home=!current[person].home;
      await set(ref(db,`weeks/${key}/${day}`),current);
    }

    if(action==="location"){
      const current=normalizeDay(data[day],days.indexOf(day));
      current[person].location=el.dataset.location;
      await set(ref(db,`weeks/${key}/${day}`),current);
    }
  }catch(err){
    console.error(err);
    document.getElementById("status").textContent="Speichern fehlgeschlagen.";
  }
});

document.addEventListener("change",async event=>{
  const el=event.target.closest("[data-action='cook']");
  if(!el) return;

  const day=el.dataset.day;

  try{
    const current=normalizeDay(data[day],days.indexOf(day));
    current.cook=el.value;
    await set(ref(db,`weeks/${key}/${day}`),current);
  }catch(err){
    console.error(err);
    document.getElementById("status").textContent="Speichern fehlgeschlagen.";
  }
});

signInAnonymously(auth)
  .then(()=>{
    onValue(ref(db,`weeks/${key}`),snapshot=>{
      data=snapshot.val() || {};
      render();
      document.getElementById("status").textContent=
        "✓ Synchronisiert · neue Woche jeweils Sonntag um 18:00 Uhr";
    });
  })
  .catch(err=>{
    console.error(err);
    document.getElementById("status").innerHTML=
      '<span class="error">Firebase-Anmeldung fehlgeschlagen.</span>';
  });

// Falls die Seite über den Wochenwechsel hinweg geöffnet bleibt:
setInterval(()=>{
  const newKey=weekKey();
  if(newKey!==key) location.reload();
},60000);

render();
</script>
</body>
</html>
