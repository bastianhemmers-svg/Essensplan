<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Essensplan</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#f4f7fb;color:#18304a}
.wrap{max-width:1050px;margin:0 auto;padding:10px}
.card{background:#fff;border-radius:22px;padding:16px;box-shadow:0 8px 30px #00000012}
h1{margin:0 0 3px;font-size:28px}.sub{margin:0 0 12px;color:#667085}
.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;min-width:720px;border-collapse:separate;border-spacing:5px;table-layout:fixed}
th,td{border-radius:12px;text-align:center}
thead th{background:#eaf0f6;padding:10px 4px;font-size:14px;font-weight:750}
thead th:first-child{width:118px;text-align:left;padding-left:9px}
tbody th{background:#f0f4f8;padding:7px 5px;text-align:left;vertical-align:middle}
td{position:relative;background:#f7f9fb;height:76px;padding:7px}
td.augsburg{background:#eaf4ff}
td.eichstaett{background:#ffdfe1;color:#b42318}
.dayname{font-weight:750;font-size:14px;margin-bottom:6px}
.cook-label{font-size:10px;color:#667085;display:block;margin-bottom:3px}
.cook-select{width:100%;padding:5px 3px;border:1px solid #d5dce6;border-radius:7px;background:#fff;font-size:11px}
.presence{display:block;width:100%;border:0;background:transparent;color:inherit;font-size:16px;font-weight:750;padding:7px 20px 7px 2px;min-height:38px}
.presence.notthere{opacity:.35}
.menu-button{position:absolute;right:3px;top:3px;width:22px;height:26px;border:0;background:transparent;font-size:18px;line-height:22px;color:#667085;padding:0}
.status{text-align:center;font-size:13px;color:#667085;margin-top:12px}
.note{text-align:center;font-size:12px;color:#667085;margin-top:9px}
.error{color:#b42318;font-weight:650}
.popup{position:fixed;z-index:1000;display:none;background:#fff;border:1px solid #d8dee8;border-radius:14px;box-shadow:0 10px 30px #00000025;padding:6px;min-width:165px}
.popup.show{display:block}
.popup-title{font-size:12px;color:#667085;padding:5px 9px 6px}
.popup button{display:block;width:100%;border:0;background:#fff;text-align:left;padding:10px;border-radius:9px;font-size:15px}
.popup button.selected{background:#eaf4ff;font-weight:700}
.popup button.eich-selected{background:#ffe5e7;color:#b42318;font-weight:700}
@media(max-width:700px){
 .wrap{padding:6px}.card{padding:10px}table{min-width:720px;border-spacing:4px}
 thead th{font-size:13px}.presence{font-size:14px}
}
</style>
</head>
<body>
<div class="wrap"><div class="card">
<h1>🍽️ Essensplan</h1>
<p class="sub">✓ = zum Essen da · – = nicht da · ⋮ = Aufenthaltsort · rot=Eichstätt </p>
<div class="table-wrap">
<table>
<thead id="thead"></thead>
<tbody id="tbody"></tbody>
</table>
</div>
<div id="status" class="status">Tabelle wird geladen …</div>
<div class="note">Die Woche wechselt automatisch sonntags um 18:00 Uhr.</div>
</div></div>

<div id="popup" class="popup">
<div class="popup-title">Aufenthaltsort</div>
<button data-location="Augsburg">🏠 Augsburg</button>
<button data-location="Eichstätt">📍 Eichstätt</button>
</div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";
import {getAuth,signInAnonymously} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";
import {getDatabase,ref,onValue,set} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-database.js";

// DIREKT AUS DER FIREBASE-CONSOLE ÜBERNOMMEN
const firebaseConfig={
 apiKey:"AIzaSyDij8UfOCWqqqHIxjMMGRrYWhEW6TwB3qI",
 authDomain:"essensplan-hanna-bastian.firebaseapp.com",
 databaseURL:"https://essensplan-hanna-bastian-default-rtdb.europe-west1.firebasedatabase.app",
 projectId:"essensplan-hanna-bastian",
 storageBucket:"essensplan-hanna-bastian.firebasestorage.app",
 messagingSenderId:"376800776043",
 appId:"1:376800776043:web:af669a07b5aac8d2b6462e"
};

const people=["Tanja","Bastian","Hanna","Matthias","Delia"];
const days=["Montag","Dienstag","Mittwoch","Donnerstag","Freitag","Samstag","Sonntag"];

const weekdayLocation={
 Tanja:"Augsburg",
 Bastian:"Augsburg",
 Hanna:"Augsburg",
 Matthias:"Eichstätt",
 Delia:"Eichstätt"
};

function weekKey(){
 const now=new Date(),d=new Date(now),day=d.getDay();
 d.setHours(0,0,0,0);
 d.setDate(d.getDate()-(day===0?6:day-1));
 if(day===0 && now.getHours()>=18)d.setDate(d.getDate()+7);
 return d.toISOString().slice(0,10);
}

function defaults(person,day){
 return {
   home:false,
   location:(day==="Samstag"||day==="Sonntag")?"":weekdayLocation[person]
 };
}

let key=weekKey();
let data={};
let popupDay=null;
let popupPerson=null;

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getDatabase(app);

function render(){
 document.getElementById("thead").innerHTML=
   "<tr><th>Tag</th>"+people.map(p=>`<th>${p}</th>`).join("")+"</tr>";

 let out="";
 for(const day of days){
   const dayData=data[day]||{};
   out+=`<tr>
     <th>
       <div class="dayname">${day}</div>
       <label class="cook-label">🍳 Wer kocht?</label>
       <select class="cook-select" data-cook="${day}">
         <option value="">– offen –</option>
         ${people.map(p=>`<option value="${p}" ${dayData.cook===p?"selected":""}>${p}</option>`).join("")}
       </select>
     </th>`;

   for(const person of people){
     const p={...defaults(person,day),...(dayData[person]||{})};
     const cls=p.location==="Eichstätt"?"eichstaett":p.location==="Augsburg"?"augsburg":"";

     out+=`<td class="${cls}">
       <button class="presence ${p.home?"":"notthere"}" data-home="${day}|${person}">
         ${p.home?"✓":"–"}
       </button>
       <button class="menu-button" aria-label="Aufenthaltsort auswählen" data-menu="${day}|${person}">⋮</button>
     </td>`;
   }
   out+="</tr>";
 }
 document.getElementById("tbody").innerHTML=out;

 document.querySelectorAll("[data-home]").forEach(b=>{
   b.onclick=async()=>{
     const [day,person]=b.dataset.home.split("|");
     const old={...defaults(person,day),...(data[day]?.[person]||{})};
     await save(day,person,{...old,home:!old.home});
   };
 });

 document.querySelectorAll("[data-menu]").forEach(b=>{
   b.onclick=e=>{
     e.stopPropagation();
     const [day,person]=b.dataset.menu.split("|");
     openPopup(b,day,person);
   };
 });

 document.querySelectorAll("[data-cook]").forEach(s=>{
   s.onchange=async()=>{
     try{
       await set(ref(db,`weeks/${key}/${s.dataset.cook}/cook`),s.value);
     }catch(e){
       showError(e);
     }
   };
 });
}

async function save(day,person,value){
 try{
   await set(ref(db,`weeks/${key}/${day}/${person}`),value);
 }catch(e){
   showError(e);
   console.error(e);
 }
}

function showError(e){
 document.getElementById("status").innerHTML=
   '<span class="error">Firebase-Fehler: '+(e.code||"unbekannt")+'</span>';
 console.error(e);
}

function openPopup(button,day,person){
 popupDay=day;
 popupPerson=person;

 const p={...defaults(person,day),...(data[day]?.[person]||{})};
 const popup=document.getElementById("popup");

 popup.querySelectorAll("[data-location]").forEach(b=>{
   b.classList.remove("selected","eich-selected");
   if(b.dataset.location===p.location){
     b.classList.add(p.location==="Eichstätt"?"eich-selected":"selected");
   }
 });

 const r=button.getBoundingClientRect();
 popup.style.left=Math.min(window.innerWidth-180,Math.max(8,r.right-175))+"px";
 popup.style.top=Math.min(window.innerHeight-125,r.bottom+5)+"px";
 popup.classList.add("show");
}

document.querySelectorAll("#popup [data-location]").forEach(b=>{
 b.onclick=async()=>{
   if(!popupDay||!popupPerson)return;

   const old={
     ...defaults(popupPerson,popupDay),
     ...(data[popupDay]?.[popupPerson]||{})
   };

   await save(popupDay,popupPerson,{
     ...old,
     location:b.dataset.location
   });

   closePopup();
 };
});

function closePopup(){
 document.getElementById("popup").classList.remove("show");
 popupDay=null;
 popupPerson=null;
}

document.addEventListener("click",e=>{
 if(!e.target.closest("#popup")&&!e.target.closest("[data-menu]"))closePopup();
});

render();

signInAnonymously(auth).then(()=>{
 document.getElementById("status").textContent="✓ Mit Firebase verbunden";

 onValue(ref(db,`weeks/${key}`),snap=>{
   data=snap.val()||{};
   render();
   document.getElementById("status").textContent="✓ Synchronisiert";
 });
}).catch(e=>{
 document.getElementById("status").innerHTML=
   '<span class="error">Firebase-Anmeldung fehlgeschlagen: '+(e.code||"unbekannter Fehler")+'</span>';
 console.error("Firebase-Anmeldung:",e);
});

setInterval(()=>{
 if(weekKey()!==key)location.reload();
},60000);
</script>
</body>
</html>
