<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Essensplan</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#17233b;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
.wrap{max-width:650px;margin:auto;padding:22px 14px 40px}.card{background:#fff;border-radius:22px;padding:22px;box-shadow:0 8px 30px #00000012}
h1{margin:0 0 5px;font-size:29px}.sub{margin:0 0 20px;color:#667085}
.day{border:1px solid #e1e7ef;border-radius:18px;margin:12px 0;padding:15px}.dayhead{margin-bottom:12px}.dayname{font-size:19px;font-weight:750}
.people{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.person{border:0;border-radius:12px;padding:12px 5px;font-weight:700;background:#edf1f6;color:#344054;font-size:15px}
.person.on{background:#dceaff;outline:2px solid #2f6fed;color:#1451b4}.cook{margin-top:12px;padding-top:12px;border-top:1px solid #edf0f4}
.cook label{font-size:14px;color:#667085;font-weight:650;display:block;margin-bottom:7px}select{width:100%;padding:11px;border-radius:10px;border:1px solid #d5dce6;background:#fff;font-size:15px}
.status{font-size:13px;color:#667085;margin-top:15px;text-align:center}.error{color:#b42318;font-weight:600;text-align:center}
</style>
</head>
<body><div class="wrap"><div class="card">
<h1>🍽️ Essensplan</h1><p class="sub">Wer ist heute zum Essen da?</p>
<div id="app">Lade Essensplan …</div><div id="status" class="status"></div>
</div></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";
import {getAuth,signInAnonymously} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";
import {getDatabase,ref,onValue,set} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-database.js";

const firebaseConfig={
 apiKey:"AIzaSyDij8UfOCWqqqHIxjMMGRrYWhEW6TwB3qI",authDomain:"essensplan-hanna-bastian.firebaseapp.com",databaseURL:"https://essensplan-hanna-bastian-default-rtdb.europe-west1.firebasedatabase.app",
 projectId:"essensplan-hanna-bastian",storageBucket:"essensplan-hanna-bastian.firebasestorage.app",
 messagingSenderId:"376800776043",appId:"1:376800776043:web:af669a07b5aac8d2b6462e"
};
const people=["Hanna","Bastian","Mama"],days=["Montag","Dienstag","Mittwoch","Donnerstag","Freitag","Samstag","Sonntag"];

function weekKey(){
 const now=new Date(),d=new Date(now),day=now.getDay();
 d.setDate(d.getDate()+(day===0?-6:1-day));
 if(day===0&&now.getHours()>=18)d.setDate(d.getDate()+7);
 return d.toISOString().slice(0,10);
}
let key=weekKey(),data={};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getDatabase(app);

function render(){
 let out="";
 for(const day of days){
  const e=data[day]||{Hanna:false,Bastian:false,Mama:false,cook:""};
  out+=`<section class="day"><div class="dayhead"><div class="dayname">${day}</div></div><div class="people">`;
  for(const p of people)out+=`<button class="person ${e[p]?"on":""}" data-day="${day}" data-person="${p}">${e[p]?"✓ ":""}${p}</button>`;
  out+=`</div><div class="cook"><label>👨‍🍳 Wer kocht?</label><select data-cook="${day}"><option value="">– noch offen –</option>`;
  for(const p of people)out+=`<option value="${p}" ${e.cook===p?"selected":""}>${p}</option>`;
  out+=`</select></div></section>`;
 }
 document.getElementById("app").innerHTML=out;
 document.querySelectorAll(".person").forEach(b=>b.onclick=async()=>{
  const d=b.dataset.day,p=b.dataset.person,e=data[d]||{Hanna:false,Bastian:false,Mama:false,cook:""};
  e[p]=!e[p];await set(ref(db,`weeks/${key}/${d}`),e);
 });
 document.querySelectorAll("select").forEach(s=>s.onchange=async()=>{
  const d=s.dataset.cook,e=data[d]||{Hanna:false,Bastian:false,Mama:false,cook:""};
  e.cook=s.value;await set(ref(db,`weeks/${key}/${d}`),e);
 });
}
async function start(){
 try{
  await signInAnonymously(auth);
  onValue(ref(db,`weeks/${key}`),snap=>{data=snap.val()||{};render();document.getElementById("status").textContent="✓ Für alle Geräte synchronisiert";});
 }catch(e){document.getElementById("app").innerHTML='<div class="error">Datenbank noch nicht eingerichtet oder Firebase-Konfiguration fehlt.</div>';console.error(e)}
}
start();
setInterval(()=>{if(weekKey()!==key)location.reload()},30000);
</script></body></html>
